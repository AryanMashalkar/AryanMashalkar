<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img"
     aria-label="Aryan Mashalkar — I build systems that have to survive contact with the real world.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1016"/>
      <stop offset="55%" stop-color="#0D141C"/>
      <stop offset="100%" stop-color="#101A24"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#56D4DD" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#58A6FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#56D4DD" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#56D4DD" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="260" fill="url(#bg)"/>
  <g opacity="0.45">
    <path d="M0 64h1280M0 128h1280M0 192h1280" stroke="#1A222C" stroke-width="1"/>
    <path d="M880 0v260M1040 0v260" stroke="#1A222C" stroke-width="1"/>
  </g>
  <ellipse cx="1010" cy="130" rx="260" ry="150" fill="url(#glow)"/>

  <text class="m" x="64" y="62" font-size="12" fill="#56D4DD" letter-spacing="3">$ whoami</text>
  <text class="t" x="64" y="126" font-size="52" font-weight="700" fill="#E6EDF3" letter-spacing="-1">Aryan Mashalkar</text>
  <rect x="66" y="146" width="320" height="2" fill="url(#rule)"/>
  <text class="t" x="66" y="188" font-size="19" fill="#8B949E">I build systems that have to survive contact with reality.</text>
  <text class="m" x="66" y="220" font-size="13" fill="#6E7681">agents &#183; applied ML &#183; backends that hold up under a test suite</text>

  <!-- terminal motif -->
  <g transform="translate(896,64)">
    <rect x="0" y="0" width="320" height="132" rx="10" fill="#0F1821" stroke="#243444"/>
    <circle cx="20" cy="18" r="4.5" fill="#F85149"/>
    <circle cx="36" cy="18" r="4.5" fill="#E3B341"/>
    <circle cx="52" cy="18" r="4.5" fill="#3FB950"/>
    <line x1="0" y1="34" x2="320" y2="34" stroke="#1B2530"/>
    <text class="m" x="18" y="60" font-size="11.5" fill="#6E7681">$ pytest -q</text>
    <text class="m" x="18" y="82" font-size="11.5" fill="#3FB950">.......................... 100%</text>
    <text class="m" x="18" y="104" font-size="11.5" fill="#C9D1D9">22 passed</text>
    <text class="m" x="18" y="122" font-size="10.5" fill="#4E5762">ship it</text>
  </g>
</svg>
